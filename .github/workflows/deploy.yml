name: Publicar y desplegar

# Cuando el CI de main pasa: construye las imágenes de producción, las publica en
# GitHub Container Registry (GHCR) y, si el servidor está configurado, despliega.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para desplegar a mano

concurrency:
  group: deploy
  cancel-in-progress: false # nunca cortar un despliegue a la mitad

jobs:
  images:
    name: Construir y publicar imágenes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          # Demo pública: el aviso y las cuentas demo del login se incrustan al compilar.
          # Para uso real, cree la variable DEMO_MODE=false en Settings → Variables.
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=${{ vars.DEMO_MODE || 'true' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}-${{ matrix.name }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.repo }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Desplegar en el servidor
    needs: images
    runs-on: ubuntu-latest
    # Solo si el servidor ya está configurado (secretos creados según docs/DEPLOY.md)
    env:
      HAS_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Servidor no configurado todavía
        if: env.HAS_SERVER != 'true'
        run: echo "::notice::Imágenes publicadas. Cree los secretos DEPLOY_HOST, DEPLOY_USER y DEPLOY_SSH_KEY para desplegar automáticamente."

      - name: Desplegar por SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/ph-gestion && ./deploy/deploy.sh ${{ needs.images.outputs.tag }}
