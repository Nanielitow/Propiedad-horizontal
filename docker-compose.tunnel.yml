# =============================================================================
#  Demo pública desde este computador con Cloudflare Tunnel (costo $0)
#
#  npm run demo:up     -> levanta todo y publica la app en internet
#  npm run demo:down   -> deja de publicarla (los datos se conservan)
#
#  Se combina con docker-compose.yml:
#    https://app.propiedadhorizontal.app       -> web-demo:3000  (la app)
#    https://archivos.propiedadhorizontal.app  -> seaweedfs:8333 (PDF, URLs firmadas)
#  Las dos rutas se configuran en Cloudflare: Zero Trust -> Networks -> Tunnels.
#  Requiere CLOUDFLARE_TUNNEL_TOKEN y las variables NEON_* en .env (nunca en Git).
#
#  La demo NO comparte nada mutable con el desarrollo local (docs/NEON.md):
#    - base de datos: Neon (api-demo, worker-demo, beat-demo); desarrollo y pruebas
#      siguen en el PostgreSQL de Docker;
#    - cola: otras bases de Redis (un worker de desarrollo nunca toma tareas de la demo);
#    - archivos: Cloudflare R2 (bucket ph-documentos); el desarrollo sigue en SeaweedFS.
# =============================================================================

x-demo-env: &demo-env
  DEMO_MODE: "true"   # límites por visitante, aviso de demo y reinicio nocturno
  APP_URL: https://app.propiedadhorizontal.app
  CORS_ORIGINS: http://localhost:3000,https://app.propiedadhorizontal.app
  DATABASE_URL: ${NEON_DATABASE_URL:?Falta NEON_DATABASE_URL en .env}
  SYNC_DATABASE_URL: ${NEON_SYNC_DATABASE_URL:?Falta NEON_SYNC_DATABASE_URL en .env}
  MIGRATIONS_DATABASE_URL: ${NEON_MIGRATIONS_DATABASE_URL:?Falta NEON_MIGRATIONS_DATABASE_URL en .env}
  REDIS_URL: redis://redis:6379/3
  CELERY_BROKER_URL: redis://redis:6379/4
  CELERY_RESULT_BACKEND: redis://redis:6379/5
  # Archivos en Cloudflare R2 (docs/R2.md): el navegador sube y descarga directo con URLs firmadas
  S3_ENDPOINT_URL: ${R2_ENDPOINT:?Falta R2_ENDPOINT en .env}
  S3_PUBLIC_ENDPOINT_URL: ${R2_ENDPOINT}
  S3_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Falta R2_ACCESS_KEY_ID en .env}
  S3_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Falta R2_SECRET_ACCESS_KEY en .env}
  S3_BUCKET: ${R2_BUCKET:?Falta R2_BUCKET en .env}
  S3_REGION: auto

x-demo-deps: &demo-deps
  redis:
    condition: service_healthy

services:
  api-demo:
    extends: { file: docker-compose.yml, service: worker }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment: *demo-env
    depends_on: *demo-deps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 10

  worker-demo:
    extends: { file: docker-compose.yml, service: worker }
    environment: *demo-env
    depends_on: *demo-deps

  beat-demo:
    extends: { file: docker-compose.yml, service: beat }
    environment: *demo-env
    depends_on: *demo-deps

  seaweedfs:
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=http://localhost:3000,https://app.propiedadhorizontal.app
      - -master.telemetry=false

  # Frontend compilado para producción (rápido, cookies Secure)
  web-demo:
    build:
      context: ./apps/web
      target: prod
      args:
        NEXT_PUBLIC_DEMO_MODE: "true"
    image: ph-saas/web:demo
    environment:
      API_INTERNAL_URL: http://api-demo:8000
      # Importar desde Google Drive (opcional; sin estas variables el botón no aparece)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER:-}
    ports:
      - "127.0.0.1:3001:3000"   # prueba local: http://localhost:3001
    depends_on:
      api-demo:
        condition: service_healthy
    restart: unless-stopped

  # Conexión saliente a Cloudflare: no abre puertos en el router
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - web-demo
      - seaweedfs
    restart: unless-stopped
